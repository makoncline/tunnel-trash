name: Closed Snow

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci
      - run: node --test tests/closed-snow.test.mjs
      - run: npm run check
